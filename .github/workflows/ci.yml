name: NEXORA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nexa_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      # Ephemeral service containers. The database name ends in _test.
      # This job never connects to the development database.
      DATABASE_URL: postgresql+psycopg://nexa:test_password@localhost:5432/nexa_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://nexa:test_password@localhost:5432/nexa_ai_test
      TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-for-production
      ENVIRONMENT: test
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx pytest-cov "psycopg[binary]"

      - name: Refuse a non-test database
        run: python -c "import os; name=os.environ['TEST_DATABASE_URL'].rsplit('/',1)[-1]; assert name.endswith('_test') and name != 'nexa_ai', name"

      - name: Run database migrations
        run: alembic upgrade head

      # tests/test_celery_document_queue.py runs in the document-worker job.
      # That job starts its own worker against this workflow's ephemeral
      # Postgres and Redis. This job does not start a worker.
      - name: Run backend tests with coverage
        run: |
          python -m pytest -v --tb=short \
            --ignore=tests/test_celery_document_queue.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  document-worker:
    name: Document worker
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nexa_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      # Separate runner, database, Redis logical database, and storage directory.
      # Nothing in this job uses the development database or Redis database 0.
      DATABASE_URL: postgresql+psycopg://nexa:test_password@localhost:5432/nexa_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://nexa:test_password@localhost:5432/nexa_ai_test
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-secret-not-for-production
      ENVIRONMENT: test
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx "psycopg[binary]"

      - name: Refuse a non-test database
        run: python -c "import os; name=os.environ['DATABASE_URL'].rsplit('/',1)[-1]; assert name.endswith('_test') and name != 'nexa_ai', name; assert os.environ['REDIS_URL'].rstrip('/').endswith('/15')"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Prepare document storage and the embedding model
        run: |
          storage="$RUNNER_TEMP/nexa-documents"
          cache="$RUNNER_TEMP/hf"
          mkdir -p "$storage" "$cache"
          echo "DOCUMENT_STORAGE_PATH=$storage" >> "$GITHUB_ENV"
          echo "HF_HOME=$cache" >> "$GITHUB_ENV"
          DOCUMENT_STORAGE_PATH="$storage" HF_HOME="$cache" python scripts/prefetch_embedding_model.py

      - name: Start the isolated document worker
        run: |
          python -m celery -A app.worker.celery_app worker --pool=solo --concurrency=1 --loglevel=info > "$RUNNER_TEMP/celery-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/celery-worker.pid"
          ready=0
          for _ in $(seq 1 60); do
            if grep -q " ready\." "$RUNNER_TEMP/celery-worker.log"; then
              ready=1
              echo worker-ready
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/celery-worker.pid")" 2>/dev/null; then
              echo "worker exited before it was ready" >&2
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 "$RUNNER_TEMP/celery-worker.log" || true
            exit 1
          fi

      - name: Run the queued document test
        run: python -m pytest -v --tb=short tests/test_celery_document_queue.py

      - name: Stop the document worker
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/celery-worker.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/celery-worker.pid")" || true
          fi

      - name: Upload worker log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: document-worker-log
          path: ${{ runner.temp }}/celery-worker.log
          if-no-files-found: ignore

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXA_API_URL: http://127.0.0.1:8000
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend]

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

  images:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t nexa-api:ci apps/api

      - name: Build worker image
        run: docker build -f apps/api/Dockerfile.worker -t nexa-worker:ci apps/api

      - name: Build web image
        run: docker build -t nexa-web:ci --build-arg NEXT_PUBLIC_API_URL=https://api.staging.example.com apps/web

  compose:
    name: Production Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production Compose with dummy values
        run: python deploy/check_prod_compose.py
