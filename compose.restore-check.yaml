# Disposable restore target.
# The project name is fixed. This file has no host ports and must not be
# combined with compose.yaml, compose.prod.yaml, or compose.local-staging.yaml.

name: nexa-restore-check

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexa-restore-check-postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - restore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

volumes:
  restore_postgres_data:
  document_storage:
  audit_export_storage:

networks:
  internal:
    driver: bridge
